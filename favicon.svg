  </defs>
  <rect x="6" y="6" width="9" height="9" fill="#8fba8c"/>
  <rect x="17" y="17" width="9" height="9" fill="url(#h)"/>
  <rect x="6.75" y="6.75" width="18.5" height="18.5" fill="none" stroke="#eeebe5" stroke-width="1.5" opacity=".92"/>
  <line x1="16" y1="6.75" x2="16" y2="25.25" stroke="#eeebe5" stroke-width="1" opacity=".55"/>
