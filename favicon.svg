<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Medijana">
  <title>Medijana — sonda u mreži</title>
  <rect width="32" height="32" rx="6" fill="#0c0c0b"/>
  <defs>
    <pattern id="h" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#cf7049" stroke-width="1.4"/>
