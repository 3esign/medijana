<!doctype html><meta charset="utf-8"><title>hdr</title>
<style>body{font:12px monospace;background:#fff;color:#000;margin:0;padding:8px}iframe{width:390px;height:700px;border:0;position:absolute;left:-9999px}pre{white-space:pre-wrap}</style>
<pre id="out">radi…</pre>
<script>
const pages=['index','registri','blizanac'];const sirine=[390,1440];const lines=[];
(async()=>{
 for(const w of sirine) for(const p of pages){
  const f=document.createElement('iframe');f.style.width=w+'px';f.src='../../'+p+'.html';document.body.appendChild(f);
  await new Promise(r=>{f.onload=r;setTimeout(r,3000)});
  await new Promise(r=>setTimeout(r,800));
  const d=f.contentDocument;
  const opis=(sel)=>{const e=d.querySelector(sel);if(!e)return sel+'=NEMA';const r=e.getBoundingClientRect();const cs=f.contentWindow.getComputedStyle(e);
    return sel+'='+Math.round(r.left)+'→'+Math.round(r.right)+' '+Math.round(r.width)+'x'+Math.round(r.height)+' disp:'+cs.display+' vis:'+cs.visibility+' op:'+cs.opacity;};
  lines.push(w+'px '+p+':\n   '+[ '.hdr','.hdr-alat','#tema-dugme','.meni-dugme','.hdr nav'].map(opis).join('\n   '));
  f.remove();document.getElementById('out').textContent=lines.join('\n');
 }
 document.getElementById('out').textContent=lines.join('\n')+'\n--KRAJ--';
})();
</script>
